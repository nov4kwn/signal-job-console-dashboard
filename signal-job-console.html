<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SIGNAL — Job Opportunity Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141a;
    --panel:#161c25;
    --panel-2:#1c2430;
    --panel-3:#212a38;
    --border:#2a3444;
    --border-soft:#20293559;
    --text:#e7ecf2;
    --text-dim:#93a1b3;
    --text-faint:#5c6c80;
    --accent:#e7a33e;
    --accent-dim:#e7a33e33;
    --good:#43d08a;
    --good-dim:#43d08a26;
    --bad:#ef6461;
    --bad-dim:#ef646126;
    --sans:'IBM Plex Sans', sans-serif;
    --display:'Space Grotesk', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim); color:var(--text);}
  .app{display:flex; min-height:100vh;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:280px; flex-shrink:0;
    background:var(--panel);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    padding:20px 16px;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:4px 4px 20px 4px; border-bottom:1px solid var(--border); margin-bottom:18px;}
  .brand-dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent);}
  .brand-text{font-family:var(--display); font-weight:700; font-size:17px; letter-spacing:0.06em;}
  .brand-sub{font-size:10px; color:var(--text-faint); font-family:var(--mono); letter-spacing:0.08em; margin-top:1px;}

  .side-btn{
    display:flex; align-items:center; gap:8px;
    width:100%; padding:10px 12px; border-radius:8px;
    background:var(--panel-2); border:1px solid var(--border);
    color:var(--text); font-family:var(--sans); font-size:13px; font-weight:500;
    cursor:pointer; transition:background .15s, border-color .15s;
    margin-bottom:8px;
  }
  .side-btn:hover{background:var(--panel-3); border-color:var(--accent);}
  .side-btn.primary{background:var(--accent-dim); border-color:var(--accent); color:var(--accent);}
  .side-btn.primary:hover{background:var(--accent); color:#1a1206;}

  .side-section{margin-top:22px;}
  .side-label{
    font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:10px; padding-left:2px;
  }

  .profile-card{
    background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    padding:12px; font-size:12px; color:var(--text-dim); position:relative;
  }
  .profile-card .status-line{display:flex; align-items:center; gap:6px; margin-bottom:6px;}
  .profile-card .status-dot{width:6px; height:6px; border-radius:50%; background:var(--good);}
  .profile-card .status-dot.empty{background:var(--text-faint);}
  .profile-card .edit-link{
    color:var(--accent); font-family:var(--mono); font-size:11px; cursor:pointer; text-decoration:none;
    display:inline-block; margin-top:6px;
  }
  .profile-card .edit-link:hover{text-decoration:underline;}

  .history-list{display:flex; flex-direction:column; gap:6px; overflow-y:auto; max-height:calc(100vh - 480px);}
  .history-item{
    display:flex; align-items:center; gap:8px;
    padding:9px 10px; border-radius:7px; cursor:pointer;
    border:1px solid transparent;
  }
  .history-item:hover{background:var(--panel-2);}
  .history-item.active{background:var(--panel-3); border-color:var(--border);}
  .rag-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .rag-dot.g{background:var(--good); box-shadow:0 0 6px var(--good-dim);}
  .rag-dot.a{background:var(--accent); box-shadow:0 0 6px var(--accent-dim);}
  .rag-dot.r{background:var(--bad); box-shadow:0 0 6px var(--bad-dim);}
  .history-item .h-text{overflow:hidden;}
  .history-item .h-title{font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .history-item .h-meta{font-size:10.5px; color:var(--text-faint); font-family:var(--mono);}
  .history-empty{font-size:12px; color:var(--text-faint); padding:8px 4px;}

  /* ---------- Main ---------- */
  .main{flex:1; padding:32px 40px 80px 40px; max-width:920px;}
  .topline{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:28px;}
  .topline h1{font-family:var(--display); font-size:22px; font-weight:600;}
  .topline p{color:var(--text-dim); font-size:13px; margin-top:4px;}

  /* -- Onboarding / profile editor -- */
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:24px;
  }
  .card h2{font-family:var(--display); font-size:16px; margin-bottom:6px;}
  .card .hint{color:var(--text-dim); font-size:12.5px; margin-bottom:16px;}
  textarea, input[type=text]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:var(--sans); font-size:13px; padding:12px;
    resize:vertical; outline:none;
  }
  textarea:focus, input[type=text]:focus{border-color:var(--accent);}
  textarea{min-height:160px; line-height:1.6;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; font-family:var(--mono); color:var(--text-faint); letter-spacing:0.04em; margin-bottom:6px; text-transform:uppercase;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .btn{
    background:var(--accent); color:#1a1206; border:none; border-radius:8px;
    padding:11px 20px; font-family:var(--sans); font-weight:600; font-size:13px;
    cursor:pointer; transition:opacity .15s; display:inline-flex; align-items:center; gap:8px;
  }
  .btn:hover{opacity:0.88;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  .btn.ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border);}
  .btn.ghost:hover{border-color:var(--accent); color:var(--accent);}
  .btn-row{display:flex; gap:10px; margin-top:6px;}

  /* -- Pipeline -- */
  .pipeline{position:relative; margin-top:4px;}
  .stage{position:relative; padding-left:34px; padding-bottom:36px;}
  .stage:last-child{padding-bottom:0;}
  .stage-line{
    position:absolute; left:9px; top:24px; bottom:0; width:2px;
    background:var(--border);
  }
  .stage:last-child .stage-line{display:none;}
  .stage-line.pulse{
    background:linear-gradient(var(--border), var(--accent), var(--border));
    background-size:100% 200%;
    animation:flow 1.4s linear infinite;
  }
  .stage-line.done{background:var(--good);}
  @keyframes flow{0%{background-position:0 200%;} 100%{background-position:0 -200%;}}

  .stage-node{
    position:absolute; left:0; top:2px; width:20px; height:20px; border-radius:50%;
    background:var(--panel-2); border:2px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:10px; color:var(--text-faint);
    transition:border-color .2s, background .2s;
  }
  .stage-node.active{border-color:var(--accent); color:var(--accent); animation:pulseNode 1.2s ease-in-out infinite;}
  @keyframes pulseNode{0%,100%{box-shadow:0 0 0 0 var(--accent-dim);} 50%{box-shadow:0 0 0 6px transparent;}}
  .stage-node.done{border-color:var(--good); background:var(--good-dim); color:var(--good);}

  .stage-eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-faint); margin-bottom:4px;}
  .stage-title{font-family:var(--display); font-size:15.5px; font-weight:600; margin-bottom:12px;}

  .stage-body{
    background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:18px 20px;
  }
  .stage-body.waiting{color:var(--text-faint); font-size:12.5px; font-style:italic; padding:14px 20px;}
  .stage-body.error{border-color:var(--bad);}

  .score-row{display:flex; align-items:baseline; gap:12px; margin-bottom:14px;}
  .score-num{font-family:var(--display); font-size:36px; font-weight:700; line-height:1;}
  .score-label{
    font-family:var(--mono); font-size:11px; padding:3px 8px; border-radius:5px; letter-spacing:0.03em;
  }
  .badge-good{background:var(--good-dim); color:var(--good);}
  .badge-warn{background:var(--accent-dim); color:var(--accent);}
  .badge-bad{background:var(--bad-dim); color:var(--bad);}

  .kv-block{margin-top:12px;}
  .kv-title{font-size:11px; font-family:var(--mono); text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); margin-bottom:7px;}
  ul.clean{list-style:none;}
  ul.clean li{
    font-size:13px; padding:6px 0 6px 16px; position:relative; color:var(--text); border-bottom:1px solid var(--border-soft);
  }
  ul.clean li:last-child{border-bottom:none;}
  ul.clean li:before{content:"–"; position:absolute; left:0; color:var(--text-faint);}
  ul.clean.gap li:before{content:"!"; color:var(--bad); font-weight:700;}
  ul.clean.match li:before{content:"✓"; color:var(--good);}

  .keyword-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px;}
  .chip{
    font-family:var(--mono); font-size:11.5px; background:var(--panel-2); border:1px solid var(--border);
    color:var(--text-dim); padding:4px 9px; border-radius:5px;
  }
  .summary-text{font-size:13px; color:var(--text-dim); margin-top:14px; line-height:1.6;}

  .q-item{
    background:var(--panel-2); border:1px solid var(--border-soft); border-radius:7px;
    padding:10px 12px; font-size:13px; margin-bottom:7px;
  }
  .q-item:last-child{margin-bottom:0;}

  /* Beacon (recommendation) */
  .beacon{
    border-radius:12px; padding:26px; text-align:left; position:relative; overflow:hidden;
    border:1px solid var(--border);
  }
  .beacon.apply{background:linear-gradient(135deg, #12251c, #161c25); border-color:var(--good);}
  .beacon.prep{background:linear-gradient(135deg, #251f12, #161c25); border-color:var(--accent);}
  .beacon.skip{background:linear-gradient(135deg, #251414, #161c25); border-color:var(--bad);}
  .beacon-verdict{
    font-family:var(--display); font-weight:700; font-size:24px; display:flex; align-items:center; gap:10px; margin-bottom:12px;
  }
  .beacon-dot{width:12px; height:12px; border-radius:50%;}
  .beacon.apply .beacon-dot{background:var(--good); box-shadow:0 0 14px var(--good);}
  .beacon.prep .beacon-dot{background:var(--accent); box-shadow:0 0 14px var(--accent);}
  .beacon.skip .beacon-dot{background:var(--bad); box-shadow:0 0 14px var(--bad);}
  .beacon-reasoning{font-size:13.5px; color:var(--text-dim); line-height:1.65; margin-bottom:10px;}
  .beacon-growth{font-size:12.5px; color:var(--text-faint); border-top:1px solid var(--border); padding-top:12px; margin-top:12px;}

  .retry-row{display:flex; align-items:center; gap:10px; color:var(--bad); font-size:12.5px;}

  .error-banner{
    position:fixed; top:0; left:0; right:0; z-index:1000;
    background:var(--bad); color:#2a0d0c; font-family:var(--mono); font-size:12.5px;
    padding:10px 18px; display:none; justify-content:space-between; align-items:center; gap:14px;
  }
  .error-banner button{
    background:transparent; border:1px solid #2a0d0c; color:#2a0d0c; border-radius:5px;
    padding:3px 10px; font-family:var(--mono); font-size:11px; cursor:pointer; flex-shrink:0;
  }
  .error-detail-box{
    font-family:var(--mono); font-size:11.5px; color:var(--text-dim); background:var(--panel-2);
    border:1px solid var(--border); border-radius:6px; padding:9px 11px; width:100%;
    word-break:break-word; white-space:pre-wrap;
  }

  .top-actions{display:flex; gap:10px; margin-bottom:20px;}
  .empty-state{color:var(--text-faint); font-size:13px; padding:40px 0; text-align:center;}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}
</style>
</head>
<body>
<div id="errorBanner" class="error-banner"></div>
<div class="app">

  <div class="sidebar">
    <div class="brand">
      <div class="brand-dot" id="brandDot"></div>
      <div>
        <div class="brand-text">SIGNAL</div>
        <div class="brand-sub">JOB OPS CONSOLE</div>
      </div>
    </div>

    <button class="side-btn primary" id="newEvalBtn">+ New evaluation</button>

    <div class="side-section">
      <div class="side-label">Profile</div>
      <div class="profile-card" id="profileCard"></div>
    </div>

    <div class="side-section" style="flex:1; display:flex; flex-direction:column;">
      <div class="side-label">History</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <div class="main" id="main"></div>
</div>

<script>
const STORAGE_PROFILE_KEY = "profile";
const STORAGE_EVALS_KEY = "evaluations-list";

let state = {
  profile: null,
  evaluations: [],
  activeEvalId: null,
  view: "loading", // loading | onboarding | profile-edit | new-job | pipeline
  pipelineRunning: false,
};

const MODEL = "claude-sonnet-4-6";

// ---------- Utilities ----------
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}
function showBanner(msg){
  const b = document.getElementById("errorBanner");
  b.innerHTML = `<span>${escapeHtml(msg)}</span><button onclick="hideBanner()">Dismiss</button>`;
  b.style.display = "flex";
}
function hideBanner(){
  document.getElementById("errorBanner").style.display = "none";
}

// ---------- Storage helpers ----------
// Note: get() throws on a key that doesn't exist yet — that's expected on first run,
// so load failures are logged quietly. Save failures are surfaced to the user, since a
// silent save failure is what makes data look like it "disappeared" after a refresh.
async function loadProfile(){
  try{
    const r = await window.storage.get(STORAGE_PROFILE_KEY, false);
    return r ? JSON.parse(r.value) : null;
  }catch(e){
    console.warn("Profile load: no existing profile, or load failed:", e && e.message);
    return null;
  }
}
async function saveProfile(p){
  try{
    const result = await window.storage.set(STORAGE_PROFILE_KEY, JSON.stringify(p), false);
    if(!result) throw new Error("storage.set returned no result");
  }catch(e){
    console.error("Profile save failed:", e);
    showBanner("Your profile didn't save (" + (e && e.message ? e.message : "unknown storage error") + "). It may not persist after refresh — try Edit profile → Save profile again.");
    throw e;
  }
}
async function loadEvaluations(){
  try{
    const r = await window.storage.get(STORAGE_EVALS_KEY, false);
    return r ? JSON.parse(r.value) : [];
  }catch(e){
    console.warn("Evaluations load: none found, or load failed:", e && e.message);
    return [];
  }
}
async function saveEvaluations(list){
  try{
    const result = await window.storage.set(STORAGE_EVALS_KEY, JSON.stringify(list), false);
    if(!result) throw new Error("storage.set returned no result");
  }catch(e){
    console.error("Evaluations save failed:", e);
    showBanner("This evaluation didn't save (" + (e && e.message ? e.message : "unknown storage error") + "). It may not persist after refresh.");
    throw e;
  }
}

// ---------- Claude call ----------
async function callAgent(system, user){
  let res;
  try{
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        system: system,
        messages: [{role:"user", content: user}]
      })
    });
  }catch(networkErr){
    throw new Error("Network request to the API failed: " + networkErr.message);
  }

  if(!res.ok){
    let detail = res.status + " " + res.statusText;
    try{
      const errBody = await res.json();
      if(errBody && errBody.error && errBody.error.message){
        detail = res.status + " — " + errBody.error.message;
      }
    }catch(_e){ /* body wasn't JSON, keep status text */ }
    throw new Error("API request failed (" + detail + ")");
  }

  const data = await res.json();
  const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  if(!textBlocks){
    throw new Error("Agent returned no text content. Raw response: " + JSON.stringify(data).slice(0, 300));
  }
  if(data.stop_reason === "max_tokens"){
    throw new Error("Response got cut off before finishing (hit the output length limit) — the JSON was never closed. This usually happens when the agent writes overly long list items. Click Retry; if it keeps happening, the prompt for this agent needs to be tightened further.");
  }
  const cleaned = textBlocks.replace(/```json/g,"").replace(/```/g,"").trim();
  const firstBrace = cleaned.indexOf("{");
  const lastBrace = cleaned.lastIndexOf("}");
  if(firstBrace === -1 || lastBrace === -1){
    throw new Error("Agent didn't return JSON. Raw output: \"" + cleaned.slice(0, 220) + (cleaned.length > 220 ? "..." : "") + "\"");
  }
  const jsonSlice = cleaned.slice(firstBrace, lastBrace + 1);
  try{
    return JSON.parse(jsonSlice);
  }catch(parseErr){
    throw new Error("Couldn't parse agent's JSON (" + parseErr.message + "). Raw output: \"" + jsonSlice.slice(0, 220) + (jsonSlice.length > 220 ? "..." : "") + "\"");
  }
}

// ---------- Agent prompts ----------
function profileBlock(){
  return `CANDIDATE PROFILE:\n${state.profile.resume}\n\nCANDIDATE TARGET CONTEXT:\n${state.profile.context || "Transitioning into entry-level GRC / AI Governance / AI Risk roles."}`;
}

const BREVITY_RULE = "STRICT LENGTH RULE: every array item must be ONE short phrase or sentence, 12 words maximum. Never pack multiple clauses, examples, or a list into a single item — split them into separate items instead. This is critical: going over the word limit causes the response to get cut off.";

async function runJobAgent(jobText){
  const system = `You are the Job Agent inside a personal career console. You assess how well a candidate fits a specific job description, grounded strictly in their actual background. The candidate is making a lateral career transition — do not overclaim experience they do not have, and do not undersell transferable experience either. Be concrete and specific to the job description's actual requirements, not generic. ${BREVITY_RULE} Respond with ONLY valid JSON, no markdown, no preamble, matching exactly this schema:
{"fit_score": <integer 0-100>, "verdict_label": "<Strong Match|Good Match|Partial Match|Weak Match>", "matching_skills": ["<max 12 words>", ...3-5 items], "gaps": ["<max 12 words>", ...2-4 items], "summary": "<2 sentences max, 40 words total>"}`;
  const user = `${profileBlock()}\n\nJOB DESCRIPTION:\n${jobText}`;
  return await callAgent(system, user);
}

async function runResumeAgent(jobText, jobAgentOutput){
  const system = `You are the Resume Agent inside a personal career console. You receive the Job Agent's fit analysis and the candidate's resume/background, and produce concrete, actionable resume edits for THIS specific job. Do not give generic resume advice — every point must be tied to specifics in the job description or the candidate's actual background. ${BREVITY_RULE} Respond with ONLY valid JSON, no markdown, matching exactly this schema:
{"priority_changes": ["<max 14 words, one concrete edit>", ...3-4 items], "highlight_experiences": ["<max 14 words>", ...2-3 items], "keywords_to_add": ["<1-3 word keyword or phrase>", ...6-8 items], "summary": "<1 sentence, 25 words max>"}`;
  const user = `${profileBlock()}\n\nJOB DESCRIPTION:\n${jobText}\n\nJOB AGENT FINDINGS (for context — build on this, don't repeat it):\n${JSON.stringify(jobAgentOutput)}`;
  return await callAgent(system, user);
}

async function runInterviewAgent(jobText, jobAgentOutput, resumeAgentOutput){
  const system = `You are the Interview Agent inside a personal career console. Using the job description and the findings from the Job Agent and Resume Agent, identify likely interview areas, generate specific interview questions for THIS role, flag prep gaps, and produce a focused prep plan. Be concrete, not generic — questions should reflect the actual seniority and domain of the job description. ${BREVITY_RULE} Keep this response especially compact since it has the most fields. Respond with ONLY valid JSON, no markdown, matching exactly this schema:
{"likely_areas": ["<max 8 words, a topic name only, not a description>", ...3-4 items], "questions": ["<one realistic question, max 22 words>", ...4-5 items], "prep_gaps": ["<max 10 words>", ...2-3 items], "prep_plan": "<3 short lines separated by \\n, each max 14 words>"}`;
  const user = `${profileBlock()}\n\nJOB DESCRIPTION:\n${jobText}\n\nJOB AGENT FINDINGS:\n${JSON.stringify(jobAgentOutput)}\n\nRESUME AGENT FINDINGS:\n${JSON.stringify(resumeAgentOutput)}`;
  return await callAgent(system, user);
}

async function runDecisionAgent(jobText, jobAgentOutput, resumeAgentOutput, interviewAgentOutput){
  const system = `You are the Decision Agent inside a personal career console — the final synthesis step. Combine the Job Agent, Resume Agent, and Interview Agent findings to produce a clear, honest recommendation. Weigh fit, career growth potential relative to the candidate's transition goals, the size of the gaps, and how preparable those gaps are in a realistic timeframe. Be decisive and avoid hedging. Keep prose tight. Respond with ONLY valid JSON, no markdown, matching exactly this schema:
{"recommendation": "<Apply|Apply with Preparation|Don't Prioritise>", "reasoning": "<3-4 sentences max, 90 words total, referencing fit score, key gaps, and growth angle>", "career_growth_note": "<1 sentence, 25 words max>"}`;
  const user = `${profileBlock()}\n\nJOB DESCRIPTION:\n${jobText}\n\nJOB AGENT FINDINGS:\n${JSON.stringify(jobAgentOutput)}\n\nRESUME AGENT FINDINGS:\n${JSON.stringify(resumeAgentOutput)}\n\nINTERVIEW AGENT FINDINGS:\n${JSON.stringify(interviewAgentOutput)}`;
  return await callAgent(system, user);
}

// ---------- Rendering ----------
function el(html){
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function ragClass(rec){
  if(rec === "Apply") return "g";
  if(rec === "Apply with Preparation") return "a";
  return "r";
}
function beaconClass(rec){
  if(rec === "Apply") return "apply";
  if(rec === "Apply with Preparation") return "prep";
  return "skip";
}
function scoreBadgeClass(score){
  if(score >= 70) return "badge-good";
  if(score >= 45) return "badge-warn";
  return "badge-bad";
}

function renderProfileCard(){
  const card = document.getElementById("profileCard");
  if(!state.profile){
    card.innerHTML = `
      <div class="status-line"><div class="status-dot empty"></div><span>No profile saved</span></div>
      <span class="edit-link" onclick="showProfileEdit()">Set up profile →</span>`;
  } else {
    const wc = state.profile.resume.split(/\s+/).length;
    card.innerHTML = `
      <div class="status-line"><div class="status-dot"></div><span>Profile saved (${wc} words)</span></div>
      <span class="edit-link" onclick="showProfileEdit()">Edit profile</span>`;
  }
}

function renderHistory(){
  const list = document.getElementById("historyList");
  if(state.evaluations.length === 0){
    list.innerHTML = `<div class="history-empty">No evaluations yet</div>`;
    return;
  }
  list.innerHTML = "";
  [...state.evaluations].reverse().forEach(ev => {
    const active = ev.id === state.activeEvalId ? "active" : "";
    const rag = ev.decision ? ragClass(ev.decision.recommendation) : "a";
    const item = el(`
      <div class="history-item ${active}" data-id="${ev.id}">
        <div class="rag-dot ${rag}"></div>
        <div class="h-text">
          <div class="h-title">${ev.title || "Untitled role"}</div>
          <div class="h-meta">${ev.company || "—"} · ${ev.date}</div>
        </div>
      </div>`);
    item.addEventListener("click", () => openEvaluation(ev.id));
    list.appendChild(item);
  });
}

function renderAll(){
  renderProfileCard();
  renderHistory();
  renderMain();
}

function renderMain(){
  const main = document.getElementById("main");
  main.innerHTML = "";

  if(state.view === "onboarding" || state.view === "profile-edit"){
    main.appendChild(buildProfileEditor());
    return;
  }
  if(state.view === "new-job"){
    main.appendChild(buildNewJobForm());
    return;
  }
  if(state.view === "pipeline"){
    main.appendChild(buildPipelineView());
    return;
  }
  // default / empty
  main.appendChild(el(`
    <div class="topline">
      <div><h1>SIGNAL</h1><p>Your job-opportunity operations console.</p></div>
    </div>
    <div class="card">
      <h2>Welcome</h2>
      <div class="hint">Save your profile once, then run every job description through Job Fit → Resume Changes → Interview Prep → Recommendation.</div>
      <button class="btn" onclick="showProfileEdit()">Set up your profile</button>
    </div>
  `));
}

function buildProfileEditor(){
  const p = state.profile || {resume:"", context:""};
  const wrap = el(`
    <div>
      <div class="topline">
        <div><h1>Your profile</h1><p>Saved once, reused for every evaluation. Paste your resume as-is — plain text is fine.</p></div>
      </div>
      <div class="card">
        <div class="field">
          <label>Resume / background</label>
          <textarea id="resumeInput" placeholder="Paste your resume text here...">${p.resume || ""}</textarea>
        </div>
        <div class="field">
          <label>Target context (optional)</label>
          <textarea id="contextInput" style="min-height:70px;" placeholder="e.g. Transitioning from Payment Risk Ops into entry-level GRC / AI Governance roles, targeting fintechs in Bengaluru.">${p.context || ""}</textarea>
        </div>
        <div class="btn-row">
          <button class="btn" id="saveProfileBtn">Save profile</button>
          ${state.profile ? '<button class="btn ghost" id="cancelProfileBtn">Cancel</button>' : ''}
        </div>
      </div>
    </div>
  `);
  wrap.querySelector("#saveProfileBtn").addEventListener("click", () => {
    const resume = wrap.querySelector("#resumeInput").value.trim();
    const context = wrap.querySelector("#contextInput").value.trim();
    if(!resume){ alert("Paste your resume text before saving."); return; }
    state.profile = {resume, context};
    state.view = "new-job";
    renderAll();
    saveProfile(state.profile).catch(e => console.error("Profile save failed:", e));
  });
  const cancelBtn = wrap.querySelector("#cancelProfileBtn");
  if(cancelBtn){
    cancelBtn.addEventListener("click", () => { state.view = "new-job"; renderAll(); });
  }
  return wrap;
}

function buildNewJobForm(){
  const wrap = el(`
    <div>
      <div class="topline">
        <div><h1>New evaluation</h1><p>Paste the job description. Job Agent, Resume Agent, Interview Agent, and Decision Agent will run in sequence.</p></div>
      </div>
      <div class="card">
        <div class="row2">
          <div class="field"><label>Role title</label><input type="text" id="titleInput" placeholder="e.g. GRC Analyst"></div>
          <div class="field"><label>Company</label><input type="text" id="companyInput" placeholder="e.g. Cashfree"></div>
        </div>
        <div class="field">
          <label>Job description</label>
          <textarea id="jdInput" style="min-height:260px;" placeholder="Paste the full job description here..."></textarea>
        </div>
        <div class="btn-row">
          <button class="btn" id="runBtn">Run evaluation →</button>
        </div>
      </div>
    </div>
  `);
  wrap.querySelector("#runBtn").addEventListener("click", () => {
    const title = wrap.querySelector("#titleInput").value.trim() || "Untitled role";
    const company = wrap.querySelector("#companyInput").value.trim();
    const jd = wrap.querySelector("#jdInput").value.trim();
    if(!jd){ alert("Paste a job description before running."); return; }
    startPipeline(title, company, jd);
  });
  return wrap;
}

function currentEval(){
  return state.evaluations.find(e => e.id === state.activeEvalId);
}

function buildPipelineView(){
  const ev = currentEval();
  const wrap = el(`
    <div>
      <div class="topline">
        <div>
          <h1>${ev.title}${ev.company ? " · " + ev.company : ""}</h1>
          <p>${ev.date}${ev.lastRunDate && ev.lastRunDate !== ev.date ? " · re-evaluated " + ev.lastRunDate : ""}</p>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn ghost" id="backBtn">← New evaluation</button>
        <button class="btn ghost" id="reEvalBtn">↻ Re-evaluate with current profile</button>
      </div>
      <div class="pipeline" id="pipelineWrap"></div>
    </div>
  `);
  wrap.querySelector("#backBtn").addEventListener("click", () => { state.view = "new-job"; renderAll(); });
  wrap.querySelector("#reEvalBtn").addEventListener("click", () => reEvaluate(ev.id));

  const pwrap = wrap.querySelector("#pipelineWrap");
  pwrap.appendChild(buildStage(1, "JOB FIT", "Job Agent", ev.job, ev.errors && ev.errors.job, renderJobStage, ev));
  pwrap.appendChild(buildStage(2, "RESUME CHANGES", "Resume Agent", ev.resume, ev.errors && ev.errors.resume, renderResumeStage, ev));
  pwrap.appendChild(buildStage(3, "INTERVIEW PREP", "Interview Agent", ev.interview, ev.errors && ev.errors.interview, renderInterviewStage, ev));
  pwrap.appendChild(buildStage(4, "RECOMMENDATION", "Decision Agent", ev.decision, ev.errors && ev.errors.decision, renderDecisionStage, ev, true));

  return wrap;
}

function buildStage(num, eyebrow, title, data, error, renderFn, ev, isLast){
  const stage = el(`
    <div class="stage">
      <div class="stage-line ${data ? 'done' : (ev.currentStage === num ? 'pulse' : '')}"></div>
      <div class="stage-node ${data ? 'done' : (ev.currentStage === num ? 'active' : '')}">${data ? '✓' : num}</div>
      <div class="stage-eyebrow">${eyebrow}</div>
      <div class="stage-title">${title}</div>
      <div class="stage-body-wrap"></div>
    </div>
  `);
  const bodyWrap = stage.querySelector(".stage-body-wrap");
  if(error){
    bodyWrap.appendChild(el(`
      <div class="stage-body error">
        <div class="retry-row" style="flex-direction:column; align-items:flex-start;">
          <span>This stage failed to run.</span>
          <div class="error-detail-box">${escapeHtml(error)}</div>
          <button class="btn ghost" style="padding:6px 12px; font-size:12px;" id="retry-${num}">Retry</button>
        </div>
      </div>
    `));
    setTimeout(() => {
      const btn = document.getElementById("retry-" + num);
      if(btn) btn.addEventListener("click", () => retryStage(num));
    }, 0);
  } else if(data){
    bodyWrap.appendChild(renderFn(data));
  } else if(ev.currentStage === num){
    bodyWrap.appendChild(el(`<div class="stage-body waiting">Running…</div>`));
  } else {
    bodyWrap.appendChild(el(`<div class="stage-body waiting">Waiting on previous stage</div>`));
  }
  return stage;
}

function renderJobStage(d){
  return el(`
    <div class="stage-body">
      <div class="score-row">
        <div class="score-num">${d.fit_score}</div>
        <div class="score-label ${scoreBadgeClass(d.fit_score)}">${d.verdict_label}</div>
      </div>
      <div class="kv-block">
        <div class="kv-title">Matching strengths</div>
        <ul class="clean match">${d.matching_skills.map(s=>`<li>${s}</li>`).join("")}</ul>
      </div>
      <div class="kv-block">
        <div class="kv-title">Gaps</div>
        <ul class="clean gap">${d.gaps.map(s=>`<li>${s}</li>`).join("")}</ul>
      </div>
      <div class="summary-text">${d.summary}</div>
    </div>
  `);
}

function renderResumeStage(d){
  return el(`
    <div class="stage-body">
      <div class="kv-block" style="margin-top:0;">
        <div class="kv-title">Priority changes</div>
        <ul class="clean">${d.priority_changes.map(s=>`<li>${s}</li>`).join("")}</ul>
      </div>
      <div class="kv-block">
        <div class="kv-title">Highlight these experiences</div>
        <ul class="clean">${d.highlight_experiences.map(s=>`<li>${s}</li>`).join("")}</ul>
      </div>
      <div class="kv-block">
        <div class="kv-title">Keywords to add</div>
        <div class="keyword-chips">${d.keywords_to_add.map(k=>`<span class="chip">${k}</span>`).join("")}</div>
      </div>
      <div class="summary-text">${d.summary}</div>
    </div>
  `);
}

function renderInterviewStage(d){
  return el(`
    <div class="stage-body">
      <div class="kv-block" style="margin-top:0;">
        <div class="kv-title">Likely interview areas</div>
        <div class="keyword-chips">${d.likely_areas.map(k=>`<span class="chip">${k}</span>`).join("")}</div>
      </div>
      <div class="kv-block">
        <div class="kv-title">Questions to prepare for</div>
        ${d.questions.map(q=>`<div class="q-item">${q}</div>`).join("")}
      </div>
      <div class="kv-block">
        <div class="kv-title">Prep gaps</div>
        <ul class="clean gap">${d.prep_gaps.map(s=>`<li>${s}</li>`).join("")}</ul>
      </div>
      <div class="kv-block">
        <div class="kv-title">Focused prep plan</div>
        <div class="summary-text" style="margin-top:6px; white-space:pre-line;">${d.prep_plan}</div>
      </div>
    </div>
  `);
}

function renderDecisionStage(d){
  const bc = beaconClass(d.recommendation);
  return el(`
    <div class="beacon ${bc}">
      <div class="beacon-verdict"><div class="beacon-dot"></div>${d.recommendation}</div>
      <div class="beacon-reasoning">${d.reasoning}</div>
      <div class="beacon-growth">${d.career_growth_note}</div>
    </div>
  `);
}

// ---------- Pipeline execution ----------
async function startPipeline(title, company, jobText){
  const id = "ev_" + Date.now();
  const ev = {
    id, title, company,
    date: new Date().toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"}),
    jobText,
    job: null, resume: null, interview: null, decision: null,
    errors: {},
    currentStage: 1
  };
  state.evaluations.push(ev);
  state.activeEvalId = id;
  state.view = "pipeline";
  renderAll();
  saveEvaluations(state.evaluations).catch(e => console.error("Save failed:", e));
  await runFrom(ev, 1);
}

async function runFrom(ev, fromStage){
  try{
    if(fromStage <= 1){
      ev.currentStage = 1; ev.errors.job = false; renderAll();
      ev.job = await runJobAgent(ev.jobText);
      renderAll();
      saveEvaluations(state.evaluations).catch(e => console.error("Save failed:", e));
    }
    if(fromStage <= 2){
      ev.currentStage = 2; ev.errors.resume = false; renderAll();
      ev.resume = await runResumeAgent(ev.jobText, ev.job);
      renderAll();
      saveEvaluations(state.evaluations).catch(e => console.error("Save failed:", e));
    }
    if(fromStage <= 3){
      ev.currentStage = 3; ev.errors.interview = false; renderAll();
      ev.interview = await runInterviewAgent(ev.jobText, ev.job, ev.resume);
      renderAll();
      saveEvaluations(state.evaluations).catch(e => console.error("Save failed:", e));
    }
    if(fromStage <= 4){
      ev.currentStage = 4; ev.errors.decision = false; renderAll();
      ev.decision = await runDecisionAgent(ev.jobText, ev.job, ev.resume, ev.interview);
      renderAll();
      saveEvaluations(state.evaluations).catch(e => console.error("Save failed:", e));
    }
    ev.currentStage = 5;
    renderAll();
  }catch(e){
    console.error(e);
    const stageNames = {1:"job", 2:"resume", 3:"interview", 4:"decision"};
    const stageName = stageNames[ev.currentStage] || "job";
    ev.errors[stageName] = (e && e.message) ? e.message : String(e);
    renderAll();
    saveEvaluations(state.evaluations).catch(err => console.error("Save failed:", err));
  }
}

function retryStage(num){
  const ev = currentEval();
  runFrom(ev, num);
}

async function reEvaluate(id){
  const ev = state.evaluations.find(e => e.id === id);
  if(!ev) return;
  ev.job = null; ev.resume = null; ev.interview = null; ev.decision = null;
  ev.errors = {};
  ev.currentStage = 1;
  ev.lastRunDate = new Date().toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"});
  renderAll();
  saveEvaluations(state.evaluations).catch(e => console.error("Save failed:", e));
  await runFrom(ev, 1);
}

function openEvaluation(id){
  state.activeEvalId = id;
  state.view = "pipeline";
  renderAll();
}

function showProfileEdit(){
  state.view = state.profile ? "profile-edit" : "onboarding";
  renderAll();
}

document.getElementById("newEvalBtn").addEventListener("click", () => {
  if(!state.profile){ state.view = "onboarding"; renderAll(); return; }
  state.activeEvalId = null;
  state.view = "new-job";
  renderAll();
});

// ---------- Init ----------
(async function init(){
  try{
    state.profile = await loadProfile();
    state.evaluations = await loadEvaluations();
    state.view = state.profile ? "new-job" : "onboarding";
    renderAll();
  }catch(e){
    console.error("Init failed:", e);
    showBanner("Couldn't load saved data (" + (e && e.message ? e.message : "unknown error") + "). Starting fresh.");
    state.view = "onboarding";
    renderAll();
  }
})();
</script>
